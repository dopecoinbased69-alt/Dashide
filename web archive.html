<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebArchiver | HTML Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .file-card:hover { transform: translateY(-4px); }
        .file-card:hover .actions { opacity: 1; }
        .actions { opacity: 0; transition: opacity 0.2s; }
        
        .thumb-container {
            position: relative;
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 1rem;
        }
        .thumb-iframe {
            width: 1280px;
            height: 800px;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            pointer-events: none;
            user-select: none;
            transform: scale(0.22);
            background: white;
        }
        .thumb-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }

        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.3s ease; }
        .drop-zone.dragover { border-color: #4f46e5; background: #f5f3ff; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <i class="fas fa-archive text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">WebArchiver</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="document.getElementById('fileInput').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 shadow-md active:scale-95">
                <i class="fas fa-upload"></i>
                <span class="hidden sm:inline">Upload HTML</span>
            </button>
            <input type="file" id="fileInput" accept=".html,.htm" class="hidden" multiple onchange="handleFileUpload(event)">
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h2 class="text-3xl font-extrabold text-slate-900">Your Repository</h2>
                <p class="text-slate-500 mt-1">Manage and preview your stored HTML snapshots locally.</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-white border border-slate-200 rounded-xl px-5 py-3 shadow-sm flex flex-col items-center min-w-[100px]">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Files</span>
                    <span id="fileCount" class="text-2xl font-black text-indigo-600 leading-none mt-1">0</span>
                </div>
            </div>
        </header>

        <div id="dropZone" class="drop-zone mb-8 rounded-2xl p-8 flex flex-col items-center justify-center text-slate-400">
            <i class="fas fa-cloud-arrow-up text-4xl mb-3"></i>
            <p class="font-medium">Drag & Drop HTML files here or use the upload button</p>
        </div>

        <div class="mb-8 relative group">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
            <input type="text" id="searchBar" placeholder="Search by filename..." oninput="renderFiles()" class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all shadow-sm text-lg">
        </div>

        <div id="dashboardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-center">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-6">
                <i class="fas fa-folder-open text-4xl text-slate-300"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">No files found</h3>
            <p class="text-slate-500 max-w-xs mx-auto">Upload your first HTML file to start building your persistent dashboard.</p>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4 sm:p-8">
        <div class="bg-white w-full max-w-7xl h-full rounded-2xl shadow-2xl overflow-hidden flex flex-col scale-95 transition-transform duration-300" id="modalContainer">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div class="flex items-center gap-3 min-w-0">
                     <i class="fas fa-file-code text-indigo-600 text-lg"></i>
                     <h3 id="modalTitle" class="font-bold text-slate-800 truncate pr-4 text-sm sm:text-base">Preview</h3>
                </div>
                <div class="flex gap-2 shrink-0">
                    <button id="externalBtn" class="text-slate-600 hover:bg-white hover:text-indigo-600 p-2.5 rounded-xl transition-all border border-transparent hover:border-slate-200 shadow-sm" title="Open in new tab">
                        <i class="fas fa-external-link-alt"></i>
                    </button>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2.5 rounded-xl transition-all">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
            </div>
            <iframe id="previewFrame" class="flex-grow w-full border-none bg-white"></iframe>
        </div>
    </div>

    <script>
        const DB_NAME = 'HtmlStorageDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'html_files';
        let db;
        let blobUrls = new Set();

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject('Database error: ' + e.target.errorCode);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        };

        const cleanupBlobs = () => {
            blobUrls.forEach(url => URL.revokeObjectURL(url));
            blobUrls.clear();
        };

        async function handleFileUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (let file of files) {
                if (!file.name.match(/\.(html|htm)$/i)) continue;
                
                const content = await file.text();
                const fileData = {
                    name: file.name,
                    size: formatBytes(file.size),
                    type: file.type || 'text/html',
                    content: content,
                    timestamp: new Date().toISOString()
                };

                await new Promise((resolve) => {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    store.add(fileData);
                    transaction.oncomplete = resolve;
                });
            }
            event.target.value = '';
            renderFiles();
        }

        async function getAllFiles() {
            return new Promise((resolve) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function deleteFile(id) {
            if (!confirm('Are you sure you want to delete this file?')) return;
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            store.delete(id);
            transaction.oncomplete = () => renderFiles();
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
        }

        async function renderFiles() {
            cleanupBlobs();
            const files = await getAllFiles();
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const grid = document.getElementById('dashboardGrid');
            const emptyState = document.getElementById('emptyState');
            const countLabel = document.getElementById('fileCount');

            const filtered = files.filter(f => f.name.toLowerCase().includes(searchTerm))
                                 .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            countLabel.textContent = files.length;
            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach((file, index) => {
                const date = new Date(file.timestamp).toLocaleDateString('en-US', { 
                    month: 'short', day: 'numeric', year: 'numeric' 
                });

                const blob = new Blob([file.content], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                blobUrls.add(url);

                const card = document.createElement('div');
                card.className = 'glass-card file-card relative group rounded-2xl p-5 transition-all duration-300 border border-slate-200 fade-in';
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="thumb-container group-hover:shadow-md transition-shadow">
                        <div class="thumb-overlay" onclick="previewFile(${file.id})"></div>
                        <iframe class="thumb-iframe" src="${url}" loading="lazy" sandbox="allow-scripts"></iframe>
                        <div class="absolute top-2 right-2 z-20 actions flex gap-1.5">
                             <button onclick="downloadFile(${file.id})" class="w-9 h-9 flex items-center justify-center bg-white shadow-lg hover:bg-emerald-50 text-slate-600 hover:text-emerald-600 rounded-xl transition-all" title="Download">
                                <i class="fas fa-download text-sm"></i>
                            </button>
                            <button onclick="deleteFile(${file.id})" class="w-9 h-9 flex items-center justify-center bg-white shadow-lg hover:bg-red-50 text-slate-600 hover:text-red-600 rounded-xl transition-all" title="Delete">
                                <i class="fas fa-trash-alt text-sm"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-start gap-3 mb-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 shrink-0 border border-indigo-100">
                            <i class="fas fa-file-code text-lg"></i>
                        </div>
                        <div class="min-w-0 flex-grow">
                            <h4 class="font-bold text-slate-900 truncate leading-tight mb-1" title="${file.name}">${file.name}</h4>
                            <div class="flex items-center gap-3 text-[11px] font-semibold text-slate-400">
                                <span class="flex items-center gap-1"><i class="far fa-calendar-alt"></i> ${date}</span>
                                <span class="flex items-center gap-1"><i class="fas fa-hdd"></i> ${file.size}</span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button onclick="previewFile(${file.id})" class="w-full py-2.5 text-sm font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-600 hover:text-white rounded-xl transition-all border border-indigo-100 hover:border-indigo-600 active:scale-[0.98]">
                            Launch Live View
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function previewFile(id) {
            const files = await getAllFiles();
            const file = files.find(f => f.id === id);
            if (!file) return;

            const modal = document.getElementById('modal');
            const modalContainer = document.getElementById('modalContainer');
            const frame = document.getElementById('previewFrame');
            const title = document.getElementById('modalTitle');
            const externalBtn = document.getElementById('externalBtn');

            const blob = new Blob([file.content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            title.textContent = file.name;
            frame.src = url;
            externalBtn.onclick = () => window.open(url, '_blank');
            
            modal.classList.remove('hidden');
            setTimeout(() => modalContainer.classList.remove('scale-95'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const modalContainer = document.getElementById('modalContainer');
            const frame = document.getElementById('previewFrame');
            modalContainer.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                frame.src = 'about:blank';
                document.body.style.overflow = 'auto';
            }, 200);
        }

        async function downloadFile(id) {
            const files = await getAllFiles();
            const file = files.find(f => f.id === id);
            if (!file) return;

            const blob = new Blob([file.content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Drag and Drop support
        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('dragover');
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFileUpload({ target: { files: files } });
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            renderFiles();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
